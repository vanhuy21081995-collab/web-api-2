<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">🎓 QUẢN LÝ SINH VIÊN</span>
        <a class="btn btn-light btn-sm" href="user/index.html">Cổng sinh viên</a>
    </div>
</nav>

<div class="container-fluid p-4">
    <div id="alert-box"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="stat-card bg-primary"><small>Tổng sinh viên</small><h2 id="total-students">0</h2></div></div>
        <div class="col-md-3"><div class="stat-card bg-success"><small>Sinh viên nam</small><h2 id="male-students">0</h2></div></div>
        <div class="col-md-3"><div class="stat-card bg-warning text-dark"><small>Sinh viên nữ</small><h2 id="female-students">0</h2></div></div>
        <div class="col-md-3"><div class="stat-card bg-dark"><small>Tổng số lớp</small><h2 id="total-classes">0</h2></div></div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Danh sách sinh viên</h5>
            <button class="btn btn-primary" onclick="openAddModal()">+ Thêm sinh viên</button>
        </div>
        <div class="card-body">
            <div class="row g-2 mb-3">
                <div class="col-md-5">
                    <input id="search-input" class="form-control" placeholder="Tìm theo mã SV hoặc họ tên...">
                </div>
                <div class="col-md-2">
                    <select id="gender-filter" class="form-select">
                        <option value="">Tất cả giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100" onclick="loadStudents(1)">🔍 Tìm kiếm</button>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100" onclick="resetFilter()">↻ Làm mới</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th><th>Mã SV</th><th>Họ tên</th><th>Ngày sinh</th>
                            <th>Giới tính</th><th>Email</th><th>Lớp</th><th>Trạng thái</th><th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <tr><td colspan="9" class="text-center">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="d-flex justify-content-center mt-3"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modal-title">Thêm sinh viên</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="student-form">
                <div class="modal-body">
                    <input type="hidden" id="student-id">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Mã sinh viên *</label><input id="MaSV" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Họ tên *</label><input id="HoTen" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Ngày sinh</label><input id="NgaySinh" type="date" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Giới tính</label>
                            <select id="GioiTinh" class="form-select"><option value="">-- Chọn --</option><option>Nam</option><option>Nữ</option></select>
                        </div>
                        <div class="col-md-4"><label class="form-label">Lớp ID *</label><input id="LopID" type="number" class="form-control" min="1" required></div>
                        <div class="col-md-6"><label class="form-label">Email</label><input id="Email" type="email" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label">Số điện thoại</label><input id="SoDienThoai" class="form-control"></div>
                        <div class="col-md-8"><label class="form-label">Địa chỉ</label><input id="DiaChi" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Trạng thái</label>
                            <select id="TrangThai" class="form-select"><option>Đang học</option><option>Bảo lưu</option><option>Đã tốt nghiệp</option><option>Nghỉ học</option></select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
