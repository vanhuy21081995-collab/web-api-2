<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng tra cứu sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:linear-gradient(135deg,#eef5ff,#f8fbff); min-height:100vh; }
        .search-card { max-width:800px; margin:70px auto 25px; border:0; border-radius:18px; }
        .student-card { border:0; border-radius:16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow search-card">
        <div class="card-body p-4 text-center">
            <h1 class="fw-bold text-primary">🎓 TRA CỨU SINH VIÊN</h1>
            <p class="text-muted">Nhập mã sinh viên hoặc họ tên để tìm kiếm</p>
            <div class="input-group input-group-lg mt-3">
                <input id="user-search" class="form-control" placeholder="VD: SV001 hoặc Nguyễn Văn A"
                       onkeydown="if(event.key==='Enter') searchUser()">
                <button class="btn btn-primary" onclick="searchUser()">Tra cứu</button>
            </div>
            <a href="../index.html" class="btn btn-link mt-2">← Quay về quản trị</a>
        </div>
    </div>
    <div id="message"></div>
    <div id="results" class="row g-3"></div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000/api";

async function searchUser() {
    const keyword = document.getElementById("user-search").value.trim();
    if (!keyword) {
        showMessage("Vui lòng nhập mã sinh viên hoặc họ tên.", "warning");
        return;
    }
    try {
        const res = await fetch(`${API_URL}/students?keyword=${encodeURIComponent(keyword)}&page=1&limit=50`);
        if (!res.ok) throw new Error("Không thể kết nối API");
        const result = await res.json();
        const list = result.data || [];
        document.getElementById("results").innerHTML = list.length ? list.map(sv => `
            <div class="col-md-6">
                <div class="card student-card shadow-sm h-100">
                    <div class="card-body">
                        <h4 class="text-primary">${safe(sv.HoTen)}</h4>
                        <hr>
                        <p><b>Mã SV:</b> ${safe(sv.MaSV)}</p>
                        <p><b>Ngày sinh:</b> ${sv.NgaySinh || "Chưa cập nhật"}</p>
                        <p><b>Giới tính:</b> ${safe(sv.GioiTinh || "Chưa cập nhật")}</p>
                        <p><b>Email:</b> ${safe(sv.Email || "Chưa cập nhật")}</p>
                        <p><b>Số điện thoại:</b> ${safe(sv.SoDienThoai || "Chưa cập nhật")}</p>
                        <p><b>Lớp ID:</b> ${sv.LopID ?? "Chưa cập nhật"}</p>
                        <p><b>Địa chỉ:</b> ${safe(sv.DiaChi || "Chưa cập nhật")}</p>
                        <span class="badge bg-success">${safe(sv.TrangThai || "")}</span>
                    </div>
                </div>
            </div>
        `).join("") : `<div class="text-center text-muted mt-4">Không tìm thấy sinh viên.</div>`;
        document.getElementById("message").innerHTML = "";
    } catch(e) {
        showMessage(e.message, "danger");
    }
}

function safe(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}
function showMessage(msg,type) {
    document.getElementById("message").innerHTML =
      `<div class="alert alert-${type}">${safe(msg)}</div>`;
}
</script>
</body>
</html>
